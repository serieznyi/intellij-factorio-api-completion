name: Project CI
on:
  pull_request: # all PRs
  push:
    branches:
    - master
env:
  JAVA_DISTRIBUTION: "temurin"
  JAVA_VERSION: "25"
  GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: true
  ACTIONS_STEP_DEBUG: true
  ARTIFACT_FILES: .
jobs:
  build:
    name: Build, Test and Analyse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: wrapper
      - name: Compile project
        id: gradle
        run: ./gradlew testClasses
      - name: Upload build reports
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: build/reports/
      - name: Run JUnit
        run: ./gradlew test
      - name: Archive JUnit result
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: build/reports/junit
      - name: Archive Jacoco Coverage result
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco
  # Prepare a draft release for GitHub Releases page for the manual verification
  # If accepted and published, the release workflow would be triggered
  releaseDraft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}
      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')
          RELEASE_NOTE="./build/tmp/release_note.txt"
          
          if gh api repos/{owner}/{repo}/git/ref/tags/$VERSION 2>/dev/null; then
            echo "Tag $VERSION already exists, skipping draft creation"
            exit 0
          fi
          
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file=$RELEASE_NOTE

          gh release create $VERSION \
            --draft \
            --title $VERSION \
            --notes-file $RELEASE_NOTE